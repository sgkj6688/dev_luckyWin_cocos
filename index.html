  <style>
    #custom-loading-screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-image: url(".splashBg.ico"); 
      background-repeat: no-repeat; background-position: center center; background-size: cover;
      z-index: 9999; display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
      padding-bottom: 12%; box-sizing: border-box;
    }
    .progress-container {
      width: 70%; height: 10px; background: rgba(0, 0, 0, 0.6); border-radius: 5px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .progress-bar {
      width: 0%; height: 100%; background: #059669; transition: width 0.1s linear;
    }
    .progress-text {
      margin-top: 10px; color: #e5e7eb; font-size: 14px; font-family: sans-serif; text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
    }
  </style>

  <script>
    (function () {
      const fileFilters = ['cocos-js/', 'src/settings.'];
      
      let totalSize = 0;        // 
      let loadedSizes = {};     // 
      let virtualPercent = 0;
      let realPercent = 0;
      let progressTimer = null;
      window.__COCOS_READY__ = false; 

      const bar = () => document.getElementById("custom-progress-bar");
      const text = () => document.getElementById("custom-progress-text");
      const screen = () => document.getElementById("custom-loading-screen");

      // 60帧/秒 
      progressTimer = setInterval(() => {
        let currentLoaded = 0;
        for (let k in loadedSizes) {
          currentLoaded += loadedSizes[k];
        }

        // 核心动态算法
        if (totalSize > 0) {
          realPercent = Math.min(Math.floor((currentLoaded / totalSize) * 100), 100);
        }

        if (virtualPercent < realPercent) {
          virtualPercent += 2;
        } else if (virtualPercent < 98) {
          // 在  没有发来就绪信号前，死死卡在 98% 蓄势待发
          virtualPercent += 0.2;
        }

        // 当  执行成功后
        if (window.__COCOS_READY__) {
          virtualPercent += 5;
        }

        if (virtualPercent > 100) virtualPercent = 100;
        const showPercent = Math.floor(virtualPercent);

        // 更新界面
        const barEl = bar(); const textEl = text();
        if (barEl) barEl.style.width = showPercent + "%";
        if (textEl) textEl.innerText = `Loading game core resources... ${showPercent}%`;

        // 淡出隐藏
        if (showPercent >= 100 && window.__COCOS_READY__) {
          clearInterval(progressTimer);
          if (screen()) {
            screen().style.transition = "opacity 0.4s ease";
            screen().style.opacity = "0";
            setTimeout(() => { screen().style.display = "none"; }, 400);
          }
        }
      }, 16);

      // 全局原生 fetch
      const originalFetch = window.fetch;
      window.fetch = async function (input, init) {
        const url = typeof input === "string" ? input : input.url;
        
        const isBigFile = fileFilters.some((filter) => url.includes(filter));
        
        if (!isBigFile) return originalFetch(input, init);

        const response = await originalFetch(input, init);
        if (!response.body) return response;

        const contentLength = response.headers.get('content-length');
        if (contentLength) {
            totalSize += parseInt(contentLength, 10);
        }

        const reader = response.body.getReader();
        const headers = new Headers(response.headers);
        const stream = new ReadableStream({
          async start(controller) {
            while (true) {
              const { done, value } = await reader.read();
              if (done) { controller.close(); break; }
              if (!loadedSizes[url]) loadedSizes[url] = 0;
              
              // 
              loadedSizes[url] += value.length;
              controller.enqueue(value);
            }
          },
        });
        return new Response(stream, { headers, status: response.status, statusText: response.statusText });
      };

      // 15秒防异常卡死
      setTimeout(() => {
          if (!window.__COCOS_READY__) {
              console.warn("⏳ 触发异常安全兜底释放...");
              window.__COCOS_READY__ = true;
          }
      }, 15000); 
    })();
  </script>

<body>
  <!--  -->
  <div id="custom-loading-screen">
    <div class="progress-container">
      <div id="custom-progress-bar" class="progress-bar"></div>
    </div>

  </div>
